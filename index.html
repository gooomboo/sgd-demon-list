<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geometry Dash Demon List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <audio id="bg-music" loop>
    <source src="music.mp3" type="audio/mp3">
    Your browser does not support the audio element.
  </audio>

  <nav class="navbar">
    <div class="nav-tabs">
      <button class="nav-btn active" onclick="switchTab('list')">Main List</button>
      <button class="nav-btn" onclick="switchTab('leaderboard')">Leaderboard</button>
      <button class="nav-btn" onclick="switchTab('roulette')">Roulette</button>
      <button class="nav-btn" onclick="switchTab('moderators')">Moderators</button>
      <a href="YOUR_GOOGLE_FORM_LINK_HERE" target="_blank" class="nav-btn">Submit Record</a>
    </div>
    <div class="nav-tools">
      <label class="icon-btn" title="Upload Custom Song File">
        📁 Song File
        <input type="file" id="song-upload" accept="audio/*" style="display: none;" onchange="loadCustomSong(event)">
      </label>
      <button class="icon-btn" id="music-toggle-btn" onclick="toggleMusic()">▶ Play Music</button>
      <button class="icon-btn" id="mute-toggle-btn" onclick="toggleMute()" style="display: none;">🔊 Mute</button>
      
      <button class="icon-btn" id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌓 Theme</button>
    </div>
  </nav>

  <div class="container" id="app-container">
    </div>

  <script src="app.js"></script>
</body>
</html>
