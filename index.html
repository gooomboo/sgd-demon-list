<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Inline, unblocked script: sets the theme BEFORE the page paints, so there's no flash of the wrong theme -->
  <script>
    (function () {
      if (localStorage.getItem('demonlist_theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demonlist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="navbar">
    <div class="nav-tabs">
      <button class="nav-btn active" id="tab-list" onclick="switchTab('list')">Demonlist</button>
      <button class="nav-btn" id="tab-stats" onclick="switchTab('stats')">Stats Viewer</button>
      <button class="nav-btn" id="tab-roulette" onclick="switchTab('roulette')">Roulette</button>
      <button class="nav-btn" id="tab-moderators" onclick="switchTab('moderators')">Moderators</button>
      <a class="nav-btn" id="submitFormBtn" href="https://forms.google.com/REPLACE_WITH_YOUR_FORM_LINK" target="_blank" rel="noopener">Submit a Record</a>
    </div>
    <div class="nav-tools">
      <button id="themeToggleBtn" class="icon-btn" onclick="toggleTheme()" title="Toggle dark mode">🌙</button>
      <label class="icon-btn" title="Choose a background song file">
        🎵
        <input type="file" id="musicFileInput" accept="audio/*" style="display:none;">
      </label>
      <button id="musicPlayBtn" class="icon-btn" onclick="toggleMusicPlay()" disabled title="Play / pause">▶️</button>
      <button id="muteBtn" class="icon-btn" onclick="toggleMute()" title="Mute / unmute">🔊</button>
    </div>
  </div>

  <audio id="bg-music" loop></audio>

  <div class="container">
    <div id="contentContainer"><p style="text-align:center;color:var(--text-muted);">Loading demonlist...</p></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
