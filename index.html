<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geometry Dash Demon List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <audio id="bg-music" loop></audio>

  <header class="navbar">
    <div class="nav-links">
      <button class="nav-btn active" id="tab-list" onclick="switchTab('list')">Demonlist</button>
      <button class="nav-btn" id="tab-stats" onclick="switchTab('stats')">Stats Viewer</button>
      <button class="nav-btn" id="tab-roulette" onclick="switchTab('roulette')">Roulette</button>
      <button class="nav-btn" id="tab-moderators" onclick="switchTab('moderators')">Moderators</button>
      
      <a href="YOUR_GOOGLE_FORM_LINK_HERE" target="_blank" class="nav-btn submit-btn">Submit Record</a>
    </div>

    <div class="nav-controls">
      <div class="audio-controls">
        <label for="musicFileInput" class="music-upload-btn" title="Choose song file from device">🎵 Song File</label>
        <input type="file" id="musicFileInput" accept="audio/*" style="display: none;">
        <button id="musicPlayBtn" class="icon-btn" onclick="toggleMusicPlay()" title="Play / Pause" disabled>▶️</button>
        <button id="muteBtn" class="icon-btn" onclick="toggleMute()" title="Mute / Unmute">🔊</button>
      </div>
      <button id="themeToggleBtn" class="icon-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌙</button>
    </div>
  </header>

  <main class="container">
    <div id="contentContainer">
      </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
