<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geometry Dash Demon List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <audio id="bg-music" loop>
    <source src="music.mp3" type="audio/mp3">
  </audio>

  <header class="navbar">
    <div class="nav-links">
      <button class="nav-btn active" onclick="switchTab('list')">Demonlist</button>
      <button class="nav-btn" onclick="switchTab('stats')">Stats Viewer</button>
      <button class="nav-btn" onclick="switchTab('roulette')">Roulette</button>
      <button class="nav-btn" onclick="switchTab('moderators')">Moderators</button>
      <a href="YOUR_GOOGLE_FORM_LINK" target="_blank" class="nav-btn submit-btn">Submit Record</a>
    </div>

    <div class="nav-controls">
      <button class="icon-btn" onclick="toggleMusic()" id="musicBtn">▶️ Play Music</button>
      <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
    </div>
  </header>

  <main class="container">
    <div id="contentContainer">
      <h2 style="text-align: center; color: var(--text-muted);">Loading Data...</h2>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
